# Render blueprint — creates the database, API and static frontend in one apply.
#
#   Render dashboard → New → Blueprint → point at this repo.
#
# Everything below fits Render's free tier. After the first deploy, open the API
# service shell and run `npm run seed` to load the demo users and data.

databases:
  - name: erp-crm-db
    databaseName: erp_crm
    user: erp_crm_user
    plan: free

services:
  - type: web
    name: erp-crm-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates and stores this; it is never in git
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false # set to the deployed frontend origin after the first deploy
      - key: SEED_DEFAULT_PASSWORD
        value: Password@123

  - type: web
    name: erp-crm-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the deployed API origin, e.g. https://erp-crm-api.onrender.com
    routes:
      # SPA fallback so deep links like /challans/:id resolve on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
